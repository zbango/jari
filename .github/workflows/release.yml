name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-desktop.yml
    with:
      trusted: ${{ github.event_name == 'push' }}
    secrets:
      mac_certificate: ${{ secrets.MAC_CSC_LINK }}
      mac_certificate_password: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      apple_id: ${{ secrets.APPLE_ID }}
      apple_app_password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
      windows_certificate: ${{ secrets.WIN_CSC_LINK }}
      windows_certificate_password: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Verify the tag and generate checksums
        run: |
          node scripts/release-artifacts.mjs validate-tag "$GITHUB_REF_NAME"
          node scripts/release-artifacts.mjs checksums release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release/*
