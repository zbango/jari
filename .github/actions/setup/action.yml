name: Install workspace dependencies
description: Activate the pinned Node and pnpm toolchain and restore the dependency store
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .node-version
    - name: Enable Corepack
      shell: pwsh
      run: |
        $shimDir = Join-Path $env:RUNNER_TEMP 'jari-pnpm-shims'
        New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
        corepack enable --install-directory $shimDir pnpm
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Add-Content -Path $env:GITHUB_PATH -Value $shimDir
    - name: Resolve pinned pnpm
      shell: bash
      run: |
        expected=$(node -p "require('./package.json').packageManager.slice('pnpm@'.length)")
        actual=$(pnpm --version)
        if [ "$actual" != "$expected" ]; then
          echo "Expected pnpm $expected but found $actual" >&2
          exit 1
        fi
        echo "Using pnpm $actual"
    - name: Locate dependency store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
