appId: app.agentdesktop.desktop
productName: Agent Desktop
asar: true
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/icon.png
  - package.json
extraResources:
  - from: node_modules/@fontsource-variable/geist/LICENSE
    to: licenses/geist-OFL.txt
  - from: node_modules/@fontsource-variable/geist-mono/LICENSE
    to: licenses/geist-mono-OFL.txt
mac:
  target: dmg
  icon: resources/icon.png
  category: public.app-category.developer-tools
  artifactName: agent-desktop-${version}-macos-${arch}.${ext}
  hardenedRuntime: true
win:
  executableName: agent-desktop
  target: nsis
  icon: resources/icon.png
  artifactName: agent-desktop-${version}-windows-${arch}.${ext}
linux:
  executableName: agent-desktop
  syncDesktopName: true
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Development
  maintainer: Agent Desktop contributors <maintainers@agent-desktop.invalid>
  artifactName: agent-desktop-${version}-linux-${arch}.${ext}
appImage:
  executableArgs: []
deb:
  packageName: agent-desktop
  depends:
    - libasound2t64 | libasound2
    - libatspi2.0-0
    - libcups2t64 | libcups2
    - libgbm1
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libsecret-1-0
    - libuuid1
    - libxss1
    - libxtst6
    - xdg-utils
